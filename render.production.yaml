services:
  - type: web
    name: vendo
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install --no-audit --no-fund && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vendo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: WEBHOOK_SECRET
        sync: false
      - key: WAVE_ENABLED
        value: "false"
      - key: ORANGE_MONEY_ENABLED
        value: "false"

databases:
  - name: vendo-db
    plan: 0.5c-1g
    diskSizeGB: 15
    databaseName: vendo
    user: vendo
